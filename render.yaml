services:
  - type: web
    name: plannr-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false
      - key: TESTFLIGHT_LINK
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: plannr-db
          property: connectionString

databases:
  - name: plannr-db
    # Paid plan (~$6/mo, 0.1 CPU / 256 MB / 1 GB storage). NOT `free` — the free
    # Render Postgres is deleted after ~30 days and has no backups. Verify the
    # exact slug on the database's Settings page in the Render dashboard if a
    # blueprint sync rejects it (Render has renamed plans over time).
    plan: basic-256mb
    region: oregon
